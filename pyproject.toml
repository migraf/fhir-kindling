[project]
name = "fhir-kindling"
version = "1.0.3"
description = "Python library to simplify working with FHIR servers and resources."
authors = [{ name = "Michael Graf", email = "michael.graf3110@gmail.com" }]
# todo add changelog when multiple readme bug is fixed
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
keywords = [
    "python",
    "fhir",
    "hl7",
    "client",
    "medical records",
    "healthcare",
    "data",
]

dependencies = ["pydantic>=2", "httpx>=0.27.0", "networkx>=3", "orjson>=3"]
requires-python = ">= 3.11"

[tool.rye]
dev-dependencies = [
    "pytest>=8.1.1",
    "pytest-dotenv>=0.5.2",
    "pytest-asyncio>=0.23.6",
    "datamodel-code-generator>=0.25.5",
    "astor>=0.8.1",
]

